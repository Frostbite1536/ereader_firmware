; InkPad — Xteink X3/X4 firmware.
; Toolchain and flags mirror the FreeInk SDK's verified configuration
; (freeink-sdk/platformio.sample.ini). One env builds a dual X3+X4 binary;
; the device is fingerprinted at boot.

[platformio]
default_envs = xteink

[env:xteink]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x) —
; the stock espressif32 platform ships an older core the SDK does not target.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The Xteink module is wired for DIO / 16 MB (not the 4 MB devkit default).
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; CrossPoint-compatible partition table — required for two-way firmware swap.
board_build.partitions = partitions.csv

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the panel controller's RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; Both Xteink profiles in one binary, runtime-selected via I2C fingerprint.
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  ; BLE HID host (keyboards). The CONFIG_BT_NIMBLE_* footprint trims from the
  ; SDK's ble-keyboard-host.md are omitted: the pioarduino core's sdkconfig.h
  ; already fixes those values (roles + 3 connections/bonds) and redefining
  ; them on the command line only produces per-file warnings that sdkconfig
  ; wins anyway.
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0

build_unflags =
  -std=gnu++11

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  h2zero/NimBLE-Arduino@^2.3.8
